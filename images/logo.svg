<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bookBg" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bookLeft" x1="8" y1="24" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="bookRight" x1="32" y1="24" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="24" y1="6" x2="40" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Shield -->
  <rect width="64" height="64" rx="18" fill="url(#bookBg)"/>
  <rect width="64" height="64" rx="18" stroke="#6366F1" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Open Book of Knowledge -->
  <path d="M32 52C25 47 15 47 8 50.5V25.5C15 22 25 22 32 26.5V52Z" fill="url(#bookLeft)" fill-opacity="0.25" stroke="url(#bookLeft)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M14 30C18 28.5 23 29 27 30.5" stroke="#A5B4FC" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.75"/>
  <path d="M14 35.5C18 34 23 34.5 27 36" stroke="#A5B4FC" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.75"/>
  <path d="M14 41C18 39.5 23 40 27 41.5" stroke="#A5B4FC" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.5"/>

  <path d="M32 52C39 47 49 47 56 50.5V25.5C49 22 39 22 32 26.5V52Z" fill="url(#bookRight)" fill-opacity="0.25" stroke="url(#bookRight)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M37 30.5C41 29 46 28.5 50 30" stroke="#7DD3FC" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.75"/>
  <path d="M37 36C41 34.5 46 34 50 35.5" stroke="#7DD3FC" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.75"/>
  <path d="M37 41.5C41 40 46 39.5 50 41" stroke="#7DD3FC" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Book Spine -->
  <path d="M32 26.5V53" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>

  <!-- Neural Rays linking book to AI core -->
  <path d="M22 21L32 14L42 21" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.8"/>
  <circle cx="22" cy="21" r="2" fill="#818CF8"/>
  <circle cx="42" cy="21" r="2" fill="#38BDF8"/>

  <!-- Radiant AI Sparkle Star of Intelligence -->
  <path d="M32 3C32.6 8 35.5 11 40.5 11.5C35.5 12 32.6 15 32 20C31.4 15 28.5 12 23.5 11.5C28.5 11 31.4 8 32 3Z" fill="url(#starGrad)" filter="url(#starGlow)"/>
  <circle cx="32" cy="11.5" r="2" fill="#FFFFFF"/>
</svg>
